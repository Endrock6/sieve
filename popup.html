<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sieve</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
      <rect x="6" y="6" width="116" height="116" rx="26" fill="currentColor" opacity="0.08"></rect>
      <path d="M30 38 H98 L84 74 Q82 80 76 80 H52 Q46 80 44 74 Z" fill="currentColor"></path>
      <circle cx="64" cy="96" r="6" fill="currentColor" opacity="0.55"></circle>
      <circle cx="64" cy="112" r="3.5" fill="currentColor" opacity="0.35"></circle>
    </svg>
    <h1>Sieve</h1>
    <button id="open-options" class="icon-button" type="button" title="Options" aria-label="Options">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.6"></path>
        <path d="M19.4 13a7.6 7.6 0 0 0 0-2l1.8-1.4-1.8-3.1-2.1.8a7.6 7.6 0 0 0-1.7-1L15.3 4h-3.6l-.3 2.3c-.6.2-1.2.6-1.7 1l-2.1-.8-1.8 3.1L7.6 11a7.6 7.6 0 0 0 0 2l-1.8 1.4 1.8 3.1 2.1-.8c.5.4 1.1.8 1.7 1l.3 2.3h3.6l.3-2.3c.6-.2 1.2-.6 1.7-1l2.1.8 1.8-3.1L19.4 13Z"
              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
      </svg>
    </button>
  </header>

  <main>
    <div class="output-row">
      <input id="output" type="text" readonly spellcheck="false"
             placeholder="No alias yet" aria-label="Generated alias">
      <button id="copy" class="ghost" type="button" title="Copy" aria-label="Copy alias" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="10" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <path d="M15 6.5V5.8A1.8 1.8 0 0 0 13.2 4H6.8A1.8 1.8 0 0 0 5 5.8v8.4A1.8 1.8 0 0 0 6.8 16h.7"
                fill="none" stroke="currentColor" stroke-width="1.6"></path>
        </svg>
      </button>
    </div>

    <p id="provenance" class="provenance" hidden></p>
    <p id="notice" class="notice" hidden></p>

    <button id="generate" class="primary" type="button">Generate</button>

    <p id="flash" class="flash" hidden>Copied</p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
